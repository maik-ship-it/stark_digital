<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cost per tracked enquiry by month, November 2025 to September 2026, falling from 107 euro to 22 euro" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cost per tracked enquiry, November 2025 to September 2026</title>

  <rect width="1200" height="675" fill="#FBFAF8"/>

  <!-- headline -->
  <text x="80" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#16314F">Cost per tracked enquiry, month by month</text>
  <text x="80" y="66" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#6C7A89">One Dublin law firm, Google Ads account, Nov 2025 to 19 Sep 2026</text>

  <!-- gridlines + y labels -->
  <g stroke="#E2DFD8" stroke-width="1">
    <line x1="80" y1="605" x2="1160" y2="605"/>
    <line x1="80" y1="471.25" x2="1160" y2="471.25"/>
    <line x1="80" y1="337.5" x2="1160" y2="337.5"/>
    <line x1="80" y1="203.75" x2="1160" y2="203.75"/>
    <line x1="80" y1="70" x2="1160" y2="70"/>
  </g>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8A95A0" text-anchor="end">
    <text x="68" y="610">€0</text>
    <text x="68" y="476">€30</text>
    <text x="68" y="342">€60</text>
    <text x="68" y="208">€90</text>
    <text x="68" y="75">€120</text>
  </g>

  <!-- line -->
  <polyline fill="none" stroke="#16314F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="80,127.4 188,417.4 296,393.3 404,386.4 512,384.3 620,223.5 728,323.6 836,187.8 944,365.7 1052,376.4 1160,508.4"/>

  <!-- points -->
  <g fill="#FBFAF8" stroke="#16314F" stroke-width="3">
    <circle cx="80" cy="127.4" r="5"/>
    <circle cx="188" cy="417.4" r="5"/>
    <circle cx="296" cy="393.3" r="5"/>
    <circle cx="404" cy="386.4" r="5"/>
    <circle cx="512" cy="384.3" r="5"/>
    <circle cx="620" cy="223.5" r="5"/>
    <circle cx="728" cy="323.6" r="5"/>
    <circle cx="836" cy="187.8" r="5"/>
    <circle cx="944" cy="365.7" r="5"/>
    <circle cx="1052" cy="376.4" r="5"/>
  </g>
  <circle cx="1160" cy="508.4" r="7" fill="#C25E32" stroke="#FBFAF8" stroke-width="3"/>

  <!-- annotated endpoints -->
  <text x="92" y="118" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16314F">€107</text>
  <text x="1148" y="537" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#C25E32" text-anchor="end">€22</text>

  <!-- April callout -->
  <text x="620" y="207" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8A95A0" text-anchor="middle">€86</text>
  <text x="836" y="171" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8A95A0" text-anchor="middle">€94</text>

  <!-- x labels -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8A95A0" text-anchor="middle">
    <text x="80" y="632">Nov</text>
    <text x="188" y="632">Dec</text>
    <text x="296" y="632">Jan</text>
    <text x="404" y="632">Feb</text>
    <text x="512" y="632">Mar</text>
    <text x="620" y="632">Apr</text>
    <text x="728" y="632">May</text>
    <text x="836" y="632">Jun</text>
    <text x="944" y="632">Jul</text>
    <text x="1052" y="632">Aug</text>
    <text x="1160" y="632">Sep</text>
  </g>

  <!-- footer -->
  <text x="80" y="663" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#A2A9B0">An enquiry is a tracked call or form submission, not a signed client. November covers six days.</text>
  <text x="1160" y="663" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#16314F" text-anchor="end">starkdigital.ie</text>
</svg>
