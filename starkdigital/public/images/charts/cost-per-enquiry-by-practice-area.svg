<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cost per tracked enquiry by practice area: immigration 34 euro, personal injury 72 euro, medical negligence 108 euro" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cost per tracked enquiry by practice area</title>

  <rect width="1200" height="675" fill="#FBFAF8"/>

  <!-- headline -->
  <text x="80" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#16314F">The same budget buys very different results</text>
  <text x="80" y="66" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#6C7A89">Cost per tracked enquiry by practice area, one Dublin law firm, Nov 2025 to 19 Sep 2026</text>

  <!-- gridlines -->
  <g stroke="#E2DFD8" stroke-width="1">
    <line x1="150" y1="560" x2="1120" y2="560"/>
    <line x1="150" y1="450" x2="1120" y2="450"/>
    <line x1="150" y1="340" x2="1120" y2="340"/>
    <line x1="150" y1="230" x2="1120" y2="230"/>
    <line x1="150" y1="120" x2="1120" y2="120"/>
  </g>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8A95A0" text-anchor="end">
    <text x="138" y="565">€0</text>
    <text x="138" y="455">€30</text>
    <text x="138" y="345">€60</text>
    <text x="138" y="235">€90</text>
    <text x="138" y="125">€120</text>
  </g>

  <!-- bars -->
  <rect x="215" y="434" width="170" height="126" fill="#2F7A6B"/>
  <rect x="515" y="297" width="170" height="263" fill="#16314F"/>
  <rect x="815" y="165" width="170" height="395" fill="#C25E32"/>

  <!-- values -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="300" y="418" fill="#2F7A6B">€34</text>
    <text x="600" y="281" fill="#16314F">€72</text>
    <text x="900" y="149" fill="#C25E32">€108</text>
  </g>

  <!-- labels -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#16314F" text-anchor="middle">
    <text x="300" y="590">Immigration</text>
    <text x="600" y="590">Personal injury</text>
    <text x="900" y="590">Medical negligence</text>
  </g>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8A95A0" text-anchor="middle">
    <text x="300" y="612">290 enquiries · €10,264 spend</text>
    <text x="600" y="612">143 enquiries · €10,242 spend</text>
    <text x="900" y="612">79 enquiries · €8,511 spend</text>
  </g>

  <!-- footer -->
  <text x="80" y="655" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#A2A9B0">Immigration and personal injury consumed almost the same budget. Immigration produced twice the enquiries.</text>
  <text x="1120" y="655" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#16314F" text-anchor="end">starkdigital.ie</text>
</svg>
